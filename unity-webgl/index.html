<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Verdant Zero | Eco Drone Flight Simulator</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <!-- Top High-Performance HUD Bar -->
      <div id="hud-top-bar">
        <div class="hud-group">
          <div id="fps-badge">
            <span id="fps-indicator" class="fps-dot"></span>
            <span id="fps-value">60 FPS</span>
            <span style="opacity:0.4;">|</span>
            <span id="frametime-value">16.6ms</span>
          </div>
          <div class="perf-toggle-group">
            <button id="btn-perf-turbo" class="perf-btn active" title="1.0x Scale - Maximum 60+ FPS & Ultra-Responsive Flight">⚡ Turbo 60 FPS</button>
            <button id="btn-perf-balanced" class="perf-btn" title="1.25x Scale - Balanced Crispness and Speed">🎨 Balanced</button>
            <button id="btn-perf-native" class="perf-btn" title="Native Display DPI - High Definition">💎 Ultra HD</button>
          </div>
        </div>
        <div class="hud-group controls-hint">
          <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Fly</span>
          <span>•</span>
          <span><kbd>Space</kbd>/<kbd>Shift</kbd> Alt</span>
          <span>•</span>
          <span><kbd>L-Click</kbd> Beam</span>
          <span>•</span>
          <span><kbd>R-Click</kbd> Seed</span>
          <span>•</span>
          <span><kbd>V</kbd> FPV</span>
        </div>
      </div>

      <!-- Unity WebGL Canvas -->
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>

      <!-- Loading Bar -->
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>

      <div id="unity-warning"></div>

      <!-- Footer Bar -->
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div class="footer-meta">
          <div id="unity-build-title">Verdant Zero • 60 FPS Optimized</div>
          <div id="unity-fullscreen-button" title="Toggle Fullscreen"></div>
        </div>
      </div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var unityInstanceRef = null;

      // Base canvas dimensions
      var baseWidth = 960;
      var baseHeight = 600;

      // Default to 1.0 DPR for rock-solid 60+ FPS and zero lag on high-DPI monitors
      var currentDpr = 1.0;

      function updateCanvasResolution(dpr) {
        currentDpr = dpr;
        if (!document.fullscreenElement) {
          canvas.style.width = baseWidth + "px";
          canvas.style.height = baseHeight + "px";
          canvas.width = Math.round(baseWidth * currentDpr);
          canvas.height = Math.round(baseHeight * currentDpr);
        }
      }

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: #990000; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: #997700; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Verdant Zero Team",
        productName: "Verdant Zero",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        devicePixelRatio: currentDpr,
        matchWebGLToCanvasSize: false,
        webglContextAttributes: {
          preserveDrawingBuffer: false,
          powerPreference: 2, // High-performance discrete GPU
          antialias: false,   // Eliminates costly software MSAA resolves
          desynchronized: true
        }
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
        config.devicePixelRatio = 1.0;
      } else {
        updateCanvasResolution(1.0);
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          unityInstanceRef = unityInstance;
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
          // Automatically focus canvas so keyboard controls respond instantly
          setTimeout(() => { canvas.focus(); }, 500);
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);

      // --- Performance Preset Buttons ---
      const btnTurbo = document.getElementById('btn-perf-turbo');
      const btnBalanced = document.getElementById('btn-perf-balanced');
      const btnNative = document.getElementById('btn-perf-native');

      function setPreset(btn, dpr) {
        document.querySelectorAll('.perf-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        updateCanvasResolution(dpr);
        canvas.focus();
      }

      btnTurbo.addEventListener('click', () => setPreset(btnTurbo, 1.0));
      btnBalanced.addEventListener('click', () => setPreset(btnBalanced, 1.25));
      btnNative.addEventListener('click', () => setPreset(btnNative, Math.min(window.devicePixelRatio || 1.0, 2.0)));

      // --- Real-time FPS & Frame-Time Telemetry Monitor ---
      let frameCount = 0;
      let lastFpsUpdate = performance.now();
      let lastFrameTime = performance.now();
      let frameTimeAccum = 0;

      function fpsLoop(now) {
        frameCount++;
        const delta = now - lastFrameTime;
        lastFrameTime = now;
        frameTimeAccum += delta;

        if (now - lastFpsUpdate >= 500) {
          const fps = Math.round((frameCount * 1000) / (now - lastFpsUpdate));
          const avgMs = (frameTimeAccum / frameCount).toFixed(1);
          const fpsValEl = document.getElementById('fps-value');
          const msValEl = document.getElementById('frametime-value');
          const dotEl = document.getElementById('fps-indicator');
          if (fpsValEl) fpsValEl.textContent = fps + ' FPS';
          if (msValEl) msValEl.textContent = avgMs + 'ms';
          if (dotEl) {
            if (fps >= 55) {
              dotEl.style.backgroundColor = '#00FF41';
              dotEl.style.boxShadow = '0 0 8px #00FF41';
            } else if (fps >= 30) {
              dotEl.style.backgroundColor = '#FFD700';
              dotEl.style.boxShadow = '0 0 8px #FFD700';
            } else {
              dotEl.style.backgroundColor = '#FF3366';
              dotEl.style.boxShadow = '0 0 8px #FF3366';
            }
          }
          frameCount = 0;
          frameTimeAccum = 0;
          lastFpsUpdate = now;
        }
        requestAnimationFrame(fpsLoop);
      }
      requestAnimationFrame(fpsLoop);

      // --- Auto-unlock Web Audio on first user interaction ---
      function unlockAudio() {
        if (typeof AudioContext !== 'undefined' || typeof webkitAudioContext !== 'undefined') {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            const ctx = new AudioCtx();
            if (ctx.state === 'suspended') ctx.resume();
          }
        }
      }
      window.addEventListener('click', unlockAudio, { once: true });
      window.addEventListener('keydown', unlockAudio, { once: true });

      // Focus canvas on mouseover for zero-delay controls
      canvas.addEventListener('mouseenter', () => canvas.focus());
    </script>
  </body>
</html>
